<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closing Count Pro</title>
    <style>
        :root {
            /* Colores Originales (Intactos) */
            --bg: #f5f7f9; --text: #1a1a1a; --border: #cfd8dc;
            --card-bg: #ffffff; --input-bg: #ffffff; --sub-text: #546e7a;
            --primary: #1565c0; --secondary: #2e7d32; --danger: #c62828; --warning: #ef6c00;
            --purple: #7b1fa2; --info: #0288d1;
            --total-box: #263238; --total-text: #ffffff;
            --shadow: rgba(0,0,0,0.15); --pattern: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg: #101214; --text: #eceff1; --border: #37474f;
            --card-bg: #1c1f24; --input-bg: #263238; --sub-text: #90a4ae;
            --primary: #64b5f6; --secondary: #81c784; --danger: #e57373; --warning: #ffb74d;
            --purple: #ce93d8; --info: #29b6f6;
            --total-box: #000000;
            --shadow: rgba(0,0,0,0.4); --pattern: rgba(255,255,255,0.05);
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg); 
            background-image: 
                linear-gradient(45deg, var(--pattern) 25%, transparent 25%, transparent 75%, var(--pattern) 75%), 
                linear-gradient(-45deg, var(--pattern) 25%, transparent 25%, transparent 75%, var(--pattern) 75%);
            background-size: 40px 40px;
            margin: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: var(--text); transition: all 0.3s ease;
        }
        
        .container { 
            background: var(--card-bg); 
            padding: 15px; border-radius: 0; border: 2px solid var(--border);
            box-shadow: 12px 12px 0 var(--shadow); 
            max-width: 1100px; width: 95%; 
            display: grid; grid-template-columns: 1fr 360px; gap: 12px; 
            position: relative; max-height: 98vh;
        }

        .top-controls { position: absolute; top: -35px; right: 0; display: flex; align-items: center; gap: 15px; }
        .theme-switch { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: bold; color: var(--sub-text); }
        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 0; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 0; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        .lang-btn { cursor: pointer; font-size: 0.8rem; border: none; background: none; color: var(--sub-text); font-weight: bold; text-transform: uppercase; }
        .lang-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { appearance: textfield; -moz-appearance: textfield; }

        .main-panel { display: flex; flex-direction: column; gap: 12px; height: 100%; }
        .card { padding: 15px; border-radius: 0; border: 1px solid var(--border); background: var(--card-bg); box-shadow: 6px 6px 0 var(--shadow); display: flex; flex-direction: column; }
        .title { font-size: 0.8rem; font-weight: 800; color: var(--sub-text); text-transform: uppercase; margin-bottom: 8px; border-bottom: 3px solid var(--primary); padding-bottom: 4px; }

        .pos-container { display: flex; gap: 15px; align-items: stretch; width: 100%; }
        .pos-column { flex: 1; display: flex; flex-direction: column; }
        .pos-column label { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; color: var(--sub-text); }

        #pos-amount, .diff-result {
            height: 60px; box-sizing: border-box; border-radius: 0;
            border: 2px solid var(--border); display: flex; flex-direction: column;
            justify-content: center; transition: all 0.3s ease; width: 100%; box-shadow: 4px 4px 0 var(--shadow);
        }

        #pos-amount {
            padding: 0 10px; font-size: 1.8rem; font-weight: 600;
            background: var(--input-bg); color: var(--text); text-align: right;
        }

        .diff-result { align-items: center; text-align: center; }
        .diff-result span:first-child { font-size: 0.65rem; text-transform: uppercase; margin-bottom: 0; opacity: 0.8; }
        .diff-result span:last-child { font-size: 1.5rem; font-weight: 800; }

        .diff-result.over { background: rgba(46, 125, 50, 0.1); color: var(--secondary); border-color: var(--secondary); }
        .diff-result.short { background: rgba(198, 40, 40, 0.1); color: var(--danger); border-color: var(--danger); }
        .diff-result.neutral { background: rgba(128, 128, 128, 0.08); color: var(--sub-text); }

        .input-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            flex-grow: 1; min-height: 0;
        }
        .input-grid .card {
            overflow-y: auto; justify-content: flex-start; gap: 10px;
        }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
        .row label { font-size: 1rem; font-weight: 700; width: 50px; }
        
        input { 
            width: 75px; padding: 6px; border: 2px solid var(--border); border-radius: 0; 
            text-align: right; font-size: 1rem; font-weight: 600; background: var(--input-bg); color: var(--text);
            box-shadow: 4px 4px 0 var(--shadow); transition: transform 0.2s, box-shadow 0.2s;
        }
        input:focus { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); outline: none; border-color: var(--primary); }

        .side-panel { display: flex; flex-direction: column; gap: 12px; height: 100%; }
        .summary-box { background: var(--total-box); color: var(--total-text); padding: 15px; border-radius: 0; text-align: center; box-shadow: 8px 8px 0 var(--shadow); flex-shrink: 0; }
        
        /* Change Breaker Compacto */
        .change-input-group { display: flex; gap: 8px; margin-bottom: 5px; }
        .change-input-group input { width: 100%; }
        .change-suggestion { display: flex; justify-content: space-between; font-weight: bold; padding: 3px 0; border-bottom: 1px dotted var(--border); font-size: 0.85rem; }
        
        .limits-card { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
        .report-list { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; overflow-y: auto; }
        .report-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
        
        .btn-reset { width: 100%; padding: 12px; cursor: pointer; background: transparent; border: 2px solid var(--danger); border-radius: 0; font-weight: 800; color: var(--danger); font-size: 0.9rem; transition: 0.2s; box-shadow: 6px 6px 0 var(--danger); margin-top: auto; flex-shrink: 0; }
        .btn-reset:hover { background: var(--danger); color: white; transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--danger); }
        .btn-reset:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--danger); }

        /* Media Queries básicas para Móvil (cuando no sea escritorio) */
        @media (max-width: 900px) {
            body { height: auto; overflow: auto; align-items: flex-start; padding: 60px 0 40px 0; }
            .container { grid-template-columns: 1fr; width: 90%; height: auto; max-height: none; }
            .top-controls { top: -50px; flex-direction: column; align-items: flex-end; gap: 10px; }
            .side-panel { height: auto; }
            .input-grid { height: auto; flex-grow: 0; }
        }

        @media (max-width: 600px) {
            .container { padding: 10px; width: 94%; }
            .input-grid { grid-template-columns: 1fr; }
            .pos-container { flex-direction: column; }
            .diff-result { height: auto; padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-controls">
        <div class="theme-switch">
            <span>Dark Mode</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="main-panel">
        <div class="card" style="border-top: 6px solid var(--primary); flex-shrink: 0;">
            <div class="title">Sales Balance</div>
            <div class="pos-container">
                <div class="pos-column">
                    <label id="t-pos-label">REPORTED POS SALES ($)</label>
                    <input type="number" id="pos-amount" placeholder="0.00" step="0.01" onkeydown="blockInvalidChars(event, true)" oninput="secureCalculate(this, true)">
                </div>
                <div class="pos-column">
                    <label id="t-diff-label">Difference Status</label>
                    <div id="diff-display" class="diff-result neutral">
                        <span>Status</span>
                        <span id="diff-value">$0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-grid">
            <div class="card">
                <div class="title">Bills</div>
                <div id="bills-area"></div>
            </div>
            <div class="card">
                <div class="title">Coins & Rolls</div>
                <div id="coins-area"></div>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="summary-box">
            <div style="font-size: 0.8rem; opacity: 0.8; letter-spacing: 1.5px;">TOTAL IN TILL</div>
            <div id="grand-total" style="font-size: 2.5rem; font-weight: 900; margin: 5px 0; font-family: 'Consolas', monospace;">$0.00</div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; margin-top: 5px;">
                <span style="font-size: 0.8rem; font-weight: bold;">FIXED FLOAT:</span>
                <input type="number" id="target-safe" value="250" style="width:90px; font-size: 1rem; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); text-align: right; padding: 5px;" onkeydown="blockInvalidChars(event, true)" oninput="secureCalculate(this, true)">
            </div>
        </div>

        <div class="card" style="border-left: 6px solid var(--purple); flex-shrink: 0;">
            <div class="title" style="color:var(--purple)">Change Breaker</div>
            <div class="change-input-group">
                <button id="break-action-btn" onclick="handleBreakAction()" style="width:100%; padding:12px; font-weight:700; border:none; background:var(--primary); color:#fff; cursor:pointer;">Action</button>
            </div>
            <div id="break-result">
                <small style="color:var(--sub-text)">Review status and request change for tomorrow.</small>
            </div>
            <div id="break-next-day" style="margin-top:10px; font-size:0.9rem; color:var(--text);"></div>
        </div>

        <button class="btn-reset" onclick="resetForm()">CLEAR ALL DATA</button>
    </div>
</div>

<script>
    const LIMIT = 99999;
    
    // Configuración Original
    const bills = [100, 50, 20, 10, 5, 2, 1];
    const coins = [0.50, 0.25, 0.10, 0.05, 0.01];
    const rollCap = { 0.50: 20, 0.25: 40, 0.10: 50, 0.05: 40, 0.01: 50 };
    const minRolls = { 0.25: 2, 0.10: 2, 0.05: 2, 0.01: 2 };
    const desiredTill = { 20: 2, 10: 4, 5: 16, 1: 50 };
    
    // Lógica Change Breaker (Prioridad $5 y $1)
    const breakdownOrder = [
        { val: 5, batch: 1 },  
        { val: 1, batch: 1 }, 
        { val: 10, batch: 1 },
        { val: 20, batch: 1 }
    ];

    let currentInventory = {};
    let currentRolls = {};
    let currentDiff = 0;
    let currentTotal = 0;
    let currentPos = 0;

    let calculationTimeout;

    function debounceCalculate() {
        clearTimeout(calculationTimeout);
        calculationTimeout = setTimeout(calculate, 300); // Espera 300ms antes de calcular
    }

    function blockInvalidChars(e, allowDecimal) {
        let keys = ["e", "E", "-", "+"];
        if (!allowDecimal) keys.push(".");
        if (keys.includes(e.key)) e.preventDefault();
    }

    function secureCalculate(input, allowDecimal) {
        let val = input.value;
        if (val < 0) input.value = 0;
        if (val > LIMIT) input.value = LIMIT;

        if (!allowDecimal && val.includes('.')) {
            input.value = Math.floor(parseFloat(val));
        }

        if (allowDecimal && val.includes('.')) {
            const parts = val.split('.');
            if (parts[1].length > 2) {
                input.value = parseFloat(val).toFixed(2);
            }
        }
        if (input.id === 'target-safe') localStorage.setItem('cashApp_target', val);
        debounceCalculate();
    }

    function initTheme() {
        const toggle = document.getElementById('mode-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('cashApp_theme');

        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.body.classList.add('dark-mode');
            toggle.checked = true;
        }
    }

    function toggleTheme() { 
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('cashApp_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    function setup() {
        const bArea = document.getElementById('bills-area');
        let billsHtml = '';
        bills.forEach(v => {
            billsHtml += `<div class="row"><label>$${v}</label><input type="number" class="qty" data-val="${v}" min="0" max="${LIMIT}" onkeydown="blockInvalidChars(event, false)" onfocus="this.select()" oninput="secureCalculate(this, false)"></div>`;
        });
        bArea.innerHTML = billsHtml;

        const cArea = document.getElementById('coins-area');
        let coinsHtml = '';
        coins.forEach(v => {
            if (v === 0.50) {
                coinsHtml += `<div class="row"><label>${v*100}¢</label><div style="display:flex; gap:6px;"><input type="number" class="qty" data-val="${v}" min="0" max="${LIMIT}" onkeydown="blockInvalidChars(event, false)" onfocus="this.select()" oninput="secureCalculate(this, false)"><div style="width: 75px; padding: 6px;"></div></div></div>`;
            } else {
                coinsHtml += `<div class="row"><label>${v*100}¢</label><div style="display:flex; gap:6px;"><input type="number" class="qty" data-val="${v}" min="0" max="${LIMIT}" onkeydown="blockInvalidChars(event, false)" onfocus="this.select()" oninput="secureCalculate(this, false)"><input type="number" class="roll-qty" data-val="${v}" min="0" max="${LIMIT}" placeholder="R" onkeydown="blockInvalidChars(event, false)" onfocus="this.select()" oninput="secureCalculate(this, false)"></div></div>`;
            }
        });
        cArea.innerHTML = coinsHtml;
        
        const savedTarget = localStorage.getItem('cashApp_target');
        if (savedTarget) document.getElementById('target-safe').value = savedTarget;

        initTheme();
        calculate();
    }

    function calculate() {
        let total = 0;
        let inventory = {};
        currentInventory = {};
        currentRolls = {};
        document.querySelectorAll('.qty').forEach(i => {
            let v = parseFloat(i.dataset.val), q = parseInt(i.value) || 0;
            inventory[v] = (inventory[v] || 0) + q;
        });
        document.querySelectorAll('.roll-qty').forEach(i => {
            let v = parseFloat(i.dataset.val), r = parseInt(i.value) || 0;
            if (v === 0.50) return;
            inventory[v] = (inventory[v] || 0) + (r * rollCap[v]);
            currentRolls[v] = r;
        });
        [...bills, ...coins].forEach(v => { total += v * (inventory[v] || 0); });
        document.getElementById('grand-total').innerText = `$${total.toFixed(2)}`;
        currentInventory = inventory;
        
        const pos = parseFloat(document.getElementById('pos-amount').value) || 0;
        const target = parseFloat(document.getElementById('target-safe').value) || 0;
        currentPos = pos;
        const diff = (total - target) - pos;
        const diffBox = document.getElementById('diff-display');
        const diffVal = document.getElementById('diff-value');

        if (pos === 0 && total === 0) {
            diffBox.className = "diff-result neutral"; diffVal.innerText = "$0.00";
        } else if (Math.abs(diff) < 0.01) {
            diffBox.className = "diff-result over"; diffVal.innerText = "BALANCED";
        } else if (diff > 0) {
            diffBox.className = "diff-result over"; diffVal.innerText = `OVER $${diff.toFixed(2)}`;
        } else {
            diffBox.className = "diff-result short"; diffVal.innerText = `SHORT $${Math.abs(diff).toFixed(2)}`;
        }
        currentDiff = diff;
        currentTotal = total;
        updateBreakButton();
    }

    function formatMoney(value) {
        return `$${value.toFixed(2)}`;
    }

    function updateBreakButton() {
        const btn = document.getElementById('break-action-btn');
        if (currentTotal <= 0) {
            btn.innerText = "Click to get recommendation";
            btn.disabled = true;
            btn.style.opacity = 0.65;
            return;
        }
        btn.disabled = false;
        btn.style.opacity = 1;
        if (currentDiff < -0.01) {
            btn.innerText = "Short cash";
        } else if (currentDiff > 0.01) {
            btn.innerText = "Excess cash";
        } else {
            btn.innerText = "Till balanced";
        }
    }

    function handleBreakAction() {
        renderBreakRecommendations();
    }

    function getBillInventory() {
        const inventory = {};
        [100, 50, 20, 10, 5, 2, 1].forEach(val => {
            inventory[val] = currentInventory[val] || 0;
        });
        return inventory;
    }

    function getExtraBillPool() {
        const pool = {};
        [100, 50, 20, 10, 5, 2, 1].forEach(val => {
            const total = currentInventory[val] || 0;
            if (desiredTill.hasOwnProperty(val)) {
                pool[val] = Math.max(0, total - desiredTill[val]);
            } else {
                pool[val] = total;
            }
        });
        return pool;
    }

    function buildGreedyPlan(amount, order) {
        let cents = Math.round(amount * 100);
        const counts = {};
        order.forEach(val => {
            const denomCents = Math.round(val * 100);
            const count = Math.floor(cents / denomCents);
            if (count > 0) {
                counts[val] = count;
                cents -= count * denomCents;
            }
        });
        return { counts, remainder: cents };
    }

    function buildCoinPlanWithInventory(amount, inventory) {
        let centsTarget = Math.round(amount * 100);
        const counts = {};
        [0.50, 0.25, 0.10, 0.05, 0.01].forEach(val => {
            const available = inventory[val] || 0;
            const denom = Math.round(val * 100);
            const use = Math.min(Math.floor(centsTarget / denom), available);
            if (use > 0) {
                counts[val] = use;
                centsTarget -= use * denom;
            }
        });
        return { counts, possible: centsTarget === 0 };
    }

    function buildBillPlanWithInventory(amount, inventory) {
        let centsTarget = Math.round(amount * 100);
        const counts = {};
        [100, 50, 20, 10, 5, 2, 1].forEach(val => {
            const available = inventory[val] || 0;
            const denom = val * 100;
            const use = Math.min(Math.floor(centsTarget / denom), available);
            if (use > 0) {
                counts[val] = use;
                centsTarget -= use * denom;
            }
        });
        return { counts, possible: centsTarget === 0 };
    }

    function sumInventoryValue(inventory) {
        return Object.keys(inventory).reduce((sum, key) => {
            const value = parseFloat(key);
            const qty = inventory[key] || 0;
            return sum + value * qty;
        }, 0);
    }

    function getMissingCoinRollRequests() {
        const needed = {};
        Object.keys(minRolls).forEach(v => {
            const actualRolls = currentRolls[v] || 0;
            let missing = minRolls[v] - actualRolls;
            if (missing > 0) {
                needed[parseFloat(v)] = missing;
            }
        });
        return needed;
    }

    function buildNextDayRequestPlan(amount) {
        let remaining = Math.floor(amount); // Usar solo la parte entera para billetes y rollos
        const requestedRolls = getMissingCoinRollRequests();
        const plan = { coinRolls: {}, tens: 0, fives: 0, ones: 0 };

        // Lógica de rollos de monedas
        const rollValues = [
            { denom: 0.25, value: 10, max: 2 },
            { denom: 0.10, value: 5,  max: 2 },
            { denom: 0.05, value: 2,  max: 2 },
        ];

        rollValues.forEach(({ denom, value, max }) => {
            const needed = requestedRolls[denom] || 0;
            if (needed > 0 && remaining >= value) {
                const canBuy = Math.floor(remaining / value);
                const buy = Math.min(canBuy, needed, max);
                plan.coinRolls[denom] = (plan.coinRolls[denom] || 0) + buy;
                remaining -= buy * value;
            }
        });

        // Lógica especial para rollos de 1 centavo
        const penniesNeeded = requestedRolls[0.01] || 0;
        if (penniesNeeded > 0 && remaining >= 1) { // 2 rollos de 1¢ cuestan $1
            plan.coinRolls[0.01] = 2; // Siempre pedir 2
            remaining -= 1;
        }

        // Lógica de billetes
        plan.tens = Math.min(Math.floor(remaining / 10), 4); // Máximo 4 billetes de $10
        remaining -= plan.tens * 10;

        plan.fives = Math.min(Math.floor(remaining / 5), 16); // Máximo 16 billetes de $5
        remaining -= plan.fives * 5;

        plan.ones = remaining; // El resto en billetes de $1
        return plan;
    }

    function buildDepositPlan() {
        const billInventory = getExtraBillPool();
        const coinInventory = {};
        coins.forEach(v => { coinInventory[v] = currentInventory[v] || 0; });

        const depositAmount = currentPos;
        const centsPart = Math.round((depositAmount - Math.floor(depositAmount)) * 100) / 100;
        const dollarPart = Math.floor(depositAmount);

        const coinPlan = centsPart > 0 ? buildCoinPlanWithInventory(centsPart, coinInventory) : { counts: {}, possible: true };
        const extraBillTotal = sumInventoryValue(billInventory);
        const billExactPlan = buildBillPlanWithInventory(dollarPart, billInventory);
        const billPlan = {
            total: extraBillTotal,
            needed: dollarPart,
            remaining: Math.max(0, extraBillTotal - dollarPart),
            counts: billExactPlan.counts,
            exact: billExactPlan.possible,
            possible: extraBillTotal >= dollarPart
        };

        return { billPlan, coinPlan, possible: coinPlan.possible && billPlan.possible };
    }

    function getBankBagLines() {
        const lines = [];
        if (currentPos <= 0) return lines;

        const deposit = buildDepositPlan();
        if (!deposit.possible) {
            if (!deposit.coinPlan.possible) lines.push("Need more coins to complete the cents for the POS deposit.");
            if (!deposit.billPlan.possible) lines.push("Need more bills to complete the POS deposit.");
            return lines;
        }

        lines.push(`Deposit from extra bills: ${formatMoney(deposit.billPlan.needed)} (Extra available: ${formatMoney(deposit.billPlan.total)})`); // This line was already hardcoded.
        
        const extraBillPool = getExtraBillPool();
        const billsAvailable = [];
        [100, 50, 20, 10, 5, 2, 1].forEach(val => {
            const qty = extraBillPool[val] || 0;
            if (qty > 0) {
                billsAvailable.push(`${qty} x $${val}`);
            }
        });
        if (billsAvailable.length > 0) {
            lines.push(`Bills to withdraw from till: ${billsAvailable.join(', ')}`);
        }
        
        if (deposit.billPlan.exact) {
            Object.keys(deposit.billPlan.counts).sort((a, b) => parseInt(b) - parseInt(a)).forEach(val => {
                if (parseInt(val) > 0) {
                    lines.push(`${deposit.billPlan.counts[val]} x $${val}`);
                }
            });
        }
        Object.keys(deposit.coinPlan.counts).sort((a, b) => parseFloat(b) - parseFloat(a)).forEach(val => {
            lines.push(`${deposit.coinPlan.counts[val]} x ${Math.round(parseFloat(val) * 100)}¢`);
        });
        if (deposit.billPlan.remaining > 0) {
            lines.push(`Remaining extra after deposit: ${formatMoney(deposit.billPlan.remaining)}`);
        }
        return lines;
    }

    function getRequestChangeLines() {
        const lines = [];
        if (currentPos <= 0) return ["No additional request needed."];

        const deposit = buildDepositPlan();
        if (!deposit.possible) {
            return ["Cannot make the exact deposit with available bills/coins."];
        }

        if (deposit.billPlan.remaining > 0) {
            lines.push(`Extra available for next-day change: ${formatMoney(deposit.billPlan.remaining)}`);
            lines.push("Bills and rolls for next day change:");
            const requestPlan = buildNextDayRequestPlan(deposit.billPlan.remaining);
            Object.keys(requestPlan.coinRolls).map(v => parseFloat(v)).sort((a, b) => b - a).forEach(denom => {
                const rollTexts = {
                    0.25: "quarter roll(s)",
                    0.10: "dime roll(s)",
                    0.05: "nickel roll(s)",
                    0.01: "penny roll(s)"
                };
                lines.push(`${requestPlan.coinRolls[denom]} ${rollTexts[denom]}`);
            });
            ['tens', 'fives', 'ones'].forEach(billKey => {
                if (requestPlan[billKey] > 0) {
                    const billValue = {tens: 10, fives: 5, ones: 1}[billKey];
                    lines.push(`${requestPlan[billKey]} x $${billValue}`);
                }
            });
        } else {
            lines.push("No extra bills remain after deposit.");
        }

        if (lines.length === 0) {
            return ["No additional request needed."];
        }
        return lines;
    }

    function renderBreakRecommendations() {
        const resDiv = document.getElementById('break-result');
        const nextDiv = document.getElementById('break-next-day');
        let html = '';
        let nextHtml = '';

        if (currentTotal <= 0) {
            html = `<small style="color:var(--sub-text)">Click to get recommendation</small>`;
        } else {
            const bagLines = getBankBagLines();
            if (bagLines.length) {
                html += `<div class="change-suggestion"><span>Put in bank bag for POS deposit:</span></div>`;
                bagLines.forEach(line => {
                    html += `<div class="change-suggestion"><span>${line}</span></div>`;
                });
            } else {
                html += `<div class="change-suggestion"><span>No extra bills/rolls for bag.</span></div>`;
            }

            if (currentDiff < -0.01) {
                const shortage = Math.abs(currentDiff);
                const plan = buildGreedyPlan(shortage, [20, 10, 5, 2, 1, 0.50, 0.25, 0.10, 0.05, 0.01]);
                html += `<div style="margin-top:10px; font-weight:700;">Needed to cover shortage: ${formatMoney(shortage)}</div>`;
                Object.keys(plan.counts).sort((a, b) => parseFloat(b) - parseFloat(a)).forEach(val => {
                    html += `<div class="change-suggestion"><span>${plan.counts[val]} x $${val}</span></div>`;
                });
                if (plan.remainder > 0) {
                    html += `<div style="color:var(--danger); font-size:0.8rem; margin-top:5px;">Remainder: ${formatMoney(plan.remainder / 100)}</div>`;
                }
            }
        }

        const requestLines = getRequestChangeLines();
        nextHtml += `<div style="font-weight:700; margin-bottom:6px;">Request for next day</div>`;
        requestLines.forEach(line => {
            nextHtml += `<div class="change-suggestion"><span>${line}</span></div>`;
        });

        resDiv.innerHTML = html;
        nextDiv.innerHTML = nextHtml;
    }

    function resetForm() {
        if(confirm("Are you sure you want to clear all data?")) {
            document.querySelectorAll('input[type="number"]').forEach(i => { 
                if(i.id !== 'target-safe') i.value = ''; 
            });
            document.getElementById('break-result').innerHTML = ''; 
            document.getElementById('break-next-day').innerHTML = '';
            calculate();
        }
    }
    setup();
</script>
</body>
</html>
